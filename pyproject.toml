[project]
name = "tamperlog"
version = "0.1.0"
description = "A signed, hash-chained, append-only log with Merkle checkpoints, inclusion and consistency proofs, and an offline verifier."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["cryptography>=43"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
tamperlog = "tamperlog.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tamperlog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["tamperlog", "tests"]
